    <h2>Useful Tags</h2>
    <!-- Using abbr to show the full meaning of HTML on hover -->
    <abbr title="HyperText Markup Language">HTML</abbr>

    <!-- Using mark to highlight an important word -->
    <p>Remember to <mark>save your work</mark> often.</p>

    <!-- Using blockquote to cite a quote -->
    <blockquote>"Trying to do better"</blockquote>


    <h2 id="dom-section">HTML DOM</h2>
    <!--
        Looking at the DOM tree of my page, the <body> element is the parent
         of every visible section, including the <figure> element in my Images
         section. The <figure> element is itself the parent of two children:
         the <img> tag and the <figcaption> tag, which are siblings sharing
         the same parent. Similarly, the <video> element is the parent of its
         <source> element, which tells the browser where to find the video
         file to play.
    -->

</body>
